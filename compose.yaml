name: parkirek

# =====================================================================
#  Parkirek - Docker Compose
#
#  services:
#    app  : aplikasi Laravel (Nginx + PHP-FPM)  -> expose ke publik (port 80)
#    db   : MySQL 8.4                          -> TIDAK ada port publik
#
#  jaringan:
#    edge    : bridge untuk app; akses dari host melalui port yang dipublikasikan
#    backend : bridge INTERNAL (app + db) -> database tidak bisa diakses
#              dari luar dan tidak bisa keluar ke internet
#
#  volume:
#    db_data     : data MySQL (bertahan setelah container dihapus)
#    app_storage : file upload + cache/session Laravel (bertahan)
# =====================================================================

services:
  # -------------------------------------------------------------------
  # Service aplikasi
  # -------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: parkirek-app:latest
    container_name: parkirek-app
    restart: unless-stopped
    init: true
    ports:
      # http://<IP_PUBLIC_VM>  ->  http://IP_PUBLIC_VM:${APP_PORT:-80}
      - "${APP_PORT:-80}:80"
    environment:
      APP_NAME: ${APP_NAME:-Parkirek}
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY:?APP_KEY wajib diisi pada file .env}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost}
      APP_LOCALE: ${APP_LOCALE:-en}
      APP_FALLBACK_LOCALE: ${APP_FALLBACK_LOCALE:-en}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Jakarta}
      LOG_CHANNEL: ${LOG_CHANNEL:-stack}
      LOG_LEVEL: ${LOG_LEVEL:-error}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-parkirek}
      DB_USERNAME: ${DB_USERNAME:-parkirek}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib diisi pada file .env}
      SESSION_DRIVER: ${SESSION_DRIVER:-file}
      SESSION_LIFETIME: ${SESSION_LIFETIME:-120}
      CACHE_STORE: ${CACHE_STORE:-file}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-sync}
      FILESYSTEM_DISK: ${FILESYSTEM_DISK:-local}
      BROADCAST_CONNECTION: ${BROADCAST_CONNECTION:-log}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app_storage:/var/www/html/storage
    networks:
      - edge
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/up || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # -------------------------------------------------------------------
  # Service database (MySQL) - internal saja, tanpa publish port
  # -------------------------------------------------------------------
  db:
    image: mysql:8.4
    container_name: parkirek-db
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      # Jika tidak diatur terpisah, password root memakai DB_PASSWORD.
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-${DB_PASSWORD:?DB_PASSWORD wajib diisi pada file .env}}
      MYSQL_DATABASE: ${DB_DATABASE:-parkirek}
      # User khusus aplikasi (image MySQL menolak MYSQL_USER=root)
      MYSQL_USER: ${DB_USERNAME:-parkirek}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib diisi pada file .env}
      TZ: ${APP_TIMEZONE:-Asia/Jakarta}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend
    # database TIDAK memiliki section "ports" -> tidak dapat diakses dari publik
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# =====================================================================
# Jaringan
# =====================================================================
networks:
  edge:
    name: parkirek_edge
    driver: bridge
  backend:
    name: parkirek_backend
    driver: bridge
    internal: true

# =====================================================================
# Volume persisten
# =====================================================================
volumes:
  db_data:
    name: parkirek_db_data
  app_storage:
    name: parkirek_app_storage
